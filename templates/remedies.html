<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayurvedic Remedies & Herbs - AyurCare</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Ayurvedic Green Palette */
            --primary-green: #4a7c59;
            --primary-green-light: #5a9870;
            --primary-green-dark: #3a6448;
            --herbal-green: #6b9080;
            --sage-green: #8ca88e;
            
            /* Earth Tones */
            --beige: #f5f1e8;
            --cream: #faf8f3;
            --sand: #e8dfd3;
            --earth-brown: #8b7355;
            
            /* Accent Colors */
            --gold: #d4af37;
            --gold-light: #dfc870;
            
            /* Neutral Colors */
            --text-primary: #2d3e3a;
            --text-secondary: #5a6c68;
            --text-light: #7a8c88;
            --white: #ffffff;
            --off-white: #fefdfb;
            --border-color: #d8d4ca;
            
            /* Shadows */
            --shadow-sm: 0 2px 4px rgba(74, 124, 89, 0.08);
            --shadow-md: 0 4px 12px rgba(74, 124, 89, 0.12);
            --shadow-lg: 0 10px 30px rgba(74, 124, 89, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--beige) 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: var(--primary-green);
            margin-bottom: 50px;
            animation: fadeInDown 1s ease;
        }

        header h1 {
            font-size: 3.5em;
            margin-bottom: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-green), var(--herbal-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(74, 124, 89, 0.1);
        }

        header p {
            font-size: 1.3em;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .top-nav {
            max-width: 1400px;
            margin: 0 auto 10px auto;
            display: flex;
            justify-content: flex-start;
        }

        .home-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary-green), var(--herbal-green));
            border: 2px solid transparent;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: var(--shadow-md);
        }

        .home-link:hover {
            background: linear-gradient(135deg, var(--primary-green-dark), var(--primary-green));
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            animation: fadeIn 1.2s ease;
        }

        .tab {
            padding: 14px 32px;
            background: var(--white);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .tab:hover {
            background: var(--off-white);
            border-color: var(--primary-green);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .tab.active {
            background: linear-gradient(135deg, var(--primary-green), var(--herbal-green));
            color: white;
            border-color: var(--primary-green);
            box-shadow: var(--shadow-md);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            animation: fadeInUp 1s ease;
        }

        .card {
            background: var(--white);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
            transition: all 0.4s ease;
            cursor: pointer;
            border: 2px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: var(--shadow-lg);
            border-color: var(--primary-green);
        }

        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .card:hover .card-image {
            transform: scale(1.1);
        }

        .card-content {
            padding: 25px;
        }

        .card-category {
            display: inline-block;
            padding: 6px 15px;
            background: linear-gradient(135deg, var(--primary-green), var(--herbal-green));
            color: white;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .card-title {
            font-size: 1.6em;
            margin-bottom: 12px;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
        }

        .card-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .benefits {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .benefit-tag {
            padding: 6px 12px;
            background: var(--cream);
            border-radius: 15px;
            font-size: 0.85em;
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2.5em;
            }
            
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

        <a class="home-link" href="{{ url_for('home') }}">← Back to Home</a>

            {

                benefits: ["Hormonal Balance", "Vitality", "Wellness"],

            {
                title: "Cinnamon",
                category: "spice",
                desc: "Sweet and warming spice that regulates blood sugar, improves circulation, and boosts metabolism.",
                benefits: ["Blood Sugar", "Circulation", "Metabolism"],

        let currentFilter = 'all';

        function renderItems(filter = 'all') {
            const grid = document.getElementById('itemsGrid');
            const filtered = filter === 'all' ? items : items.filter(item => item.category === filter);
            
            grid.innerHTML = filtered.map(item => `
                <div class="card">
                    <img src="${item.image}" alt="${item.title}" class="card-image">
                    <div class="card-content">
                        <span class="card-category">${item.category.toUpperCase()}</span>
                        <h3 class="card-title">${item.title}</h3>
                        <p class="card-desc">${item.desc}</p>
                        <div class="benefits">
                            ${item.benefits.map(b => `<span class="benefit-tag">✓ ${b}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function filterItems(evt, category) {
            currentFilter = category;

            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            if (evt && evt.currentTarget) {
                evt.currentTarget.classList.add('active');
            }
            
            renderItems(category);
        }

        renderItems();
    </script>
